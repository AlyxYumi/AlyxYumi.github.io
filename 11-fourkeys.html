<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一个键盘四个人 · 相扑擂台</title>
<style>
  html,body{margin:0;min-height:100%;background:#0a0b0f;color:#e7eef6;overflow:hidden;
    font-family:ui-monospace,"SFMono-Regular",Consolas,monospace;-webkit-user-select:none;user-select:none}
  #wrap{position:fixed;inset:0;display:grid;place-items:center}
  canvas{display:block;width:min(100vw,1320px);height:auto;box-shadow:0 30px 120px #000a}
  #help{position:fixed;left:0;right:0;bottom:10px;text-align:center;font-size:11px;color:#4d5b6b;letter-spacing:.08em}
  #help b{color:#8b9cae;font-weight:400}
</style>
</head>
<body>
<div id="wrap"><canvas id="cv" width="1000" height="680"></canvas></div>
<div id="help">一个键盘，四个人抢地盘 —— <b>R</b> 重开</div>
<script>
(function () {
  "use strict";
  const cv = document.getElementById("cv");
  const ctx = cv.getContext("2d");
  const W = cv.width, H = cv.height;
  const CX = W / 2, CY = H / 2 + 6;

  const KEYSETS = [
    { up: "w", down: "s", left: "a", right: "d", color: "#4fd1ff", name: "P1" },
    { up: "arrowup", down: "arrowdown", left: "arrowleft", right: "arrowright", color: "#ffb84d", name: "P2" },
    { up: "i", down: "k", left: "j", right: "l", color: "#8b7bff", name: "P3" },
    { up: "t", down: "g", left: "f", right: "h", color: "#4dffa8", name: "P4" }
  ];
  const KEYHINT = ["W A S D", "↑ ← ↓ →", "I J K L", "T F G H"];

  const keys = Object.create(null);
  let players = [];
  let state = "menu";
  let countT = 0, timeT = 0, arenaR = 280, shake = 0, winner = null, roundN = 1;
  let startCount = 2;

  function reset(n) {
    players = [];
    const R0 = 165;
    for (let i = 0; i < n; i++) {
      const a = -Math.PI / 2 + i * (Math.PI * 2 / n);
      const ks = KEYSETS[i];
      players.push({
        x: CX + Math.cos(a) * R0, y: CY + Math.sin(a) * R0,
        vx: 0, vy: 0, r: 27, alive: true, fall: 0,
        color: ks.color, name: ks.name, ks: ks, fx: 1, fy: 0, face: a
      });
    }
    arenaR = 280; timeT = 0; shake = 0; winner = null;
    state = "count"; countT = 1.6;
  }

  /* ================= 物理 ================= */
  function step(dt) {
    if (state === "count") {
      countT -= dt;
      if (countT <= 0) state = "play";
      for (const p of players) { p.vx *= 0.9; p.vy *= 0.9; }
      return;
    }
    if (state !== "play") {
      for (const p of players) {
        if (!p.alive) p.fall += dt;
      }
      return;
    }

    timeT += dt;
    arenaR = Math.max(64, 280 - timeT * 8.5);

    for (const p of players) {
      if (!p.alive) { p.fall += dt; continue; }
      let ax = 0, ay = 0;
      if (keys[p.ks.up]) ay -= 1;
      if (keys[p.ks.down]) ay += 1;
      if (keys[p.ks.left]) ax -= 1;
      if (keys[p.ks.right]) ax += 1;
      const len = Math.hypot(ax, ay);
      if (len > 0) {
        ax /= len; ay /= len;
        p.fx = ax; p.fy = ay; p.face = Math.atan2(ay, ax);
        p.vx += ax * 1550 * dt;
        p.vy += ay * 1550 * dt;
      }
      const damp = Math.exp(-3.4 * dt);
      p.vx *= damp; p.vy *= damp;
      const sp = Math.hypot(p.vx, p.vy);
      const max = 355;
      if (sp > max) { p.vx = p.vx / sp * max; p.vy = p.vy / sp * max; }
      p.x += p.vx * dt;
      p.y += p.vy * dt;
    }

    // 互相推挤
    for (let i = 0; i < players.length; i++) {
      for (let j = i + 1; j < players.length; j++) {
        const a = players[i], b = players[j];
        if (!a.alive || !b.alive) continue;
        const dx = b.x - a.x, dy = b.y - a.y;
        let d = Math.hypot(dx, dy);
        if (d < 0.001) { d = 0.001; }
        const overlap = a.r + b.r - d;
        if (overlap <= 0) continue;
        const nx = dx / d, ny = dy / d;
        a.x -= nx * overlap / 2; a.y -= ny * overlap / 2;
        b.x += nx * overlap / 2; b.y += ny * overlap / 2;
        const rvx = b.vx - a.vx, rvy = b.vy - a.vy;
        const vn = rvx * nx + rvy * ny;
        if (vn < 0) {
          const imp = -(1 + 0.62) * vn / 2;
          a.vx -= imp * nx; a.vy -= imp * ny;
          b.vx += imp * nx; b.vy += imp * ny;
          if (-vn > 220) shake = Math.min(14, -vn / 60);
        }
      }
    }

    // 出场判定
    for (const p of players) {
      if (!p.alive) continue;
      const d = Math.hypot(p.x - CX, p.y - CY);
      if (d > arenaR - p.r * 0.45) {
        p.alive = false;
        p.fall = 0;
        shake = 16;
        p.vx = (p.x - CX) * 2.2;
        p.vy = (p.y - CY) * 2.2;
      }
    }

    const alive = players.filter(p => p.alive);
    if (alive.length <= 1) {
      winner = alive[0] || null;
      state = "over";
      roundN++;
    }
  }

  /* ================= 绘制 ================= */
  function draw() {
    ctx.save();
    if (shake > 0.2) {
      ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    }

    // 背景
    const bg = ctx.createRadialGradient(CX, CY, 60, CX, CY, 620);
    bg.addColorStop(0, "#182231");
    bg.addColorStop(.55, "#0d1219");
    bg.addColorStop(1, "#07090c");
    ctx.fillStyle = bg;
    ctx.fillRect(-40, -40, W + 80, H + 80);

    // 擂台
    ctx.save();
    ctx.beginPath();
    ctx.arc(CX, CY, arenaR, 0, Math.PI * 2);
    const floor = ctx.createRadialGradient(CX, CY - 40, 20, CX, CY, arenaR);
    floor.addColorStop(0, "#2b3a4d");
    floor.addColorStop(1, "#141c26");
    ctx.fillStyle = floor;
    ctx.fill();
    ctx.clip();
    ctx.strokeStyle = "rgba(255,255,255,.045)";
    ctx.lineWidth = 1;
    for (let r = 40; r < arenaR; r += 40) {
      ctx.beginPath(); ctx.arc(CX, CY, r, 0, Math.PI * 2); ctx.stroke();
    }
    ctx.restore();

    // 边缘警示
    const danger = 1 - (arenaR - 64) / 216;
    ctx.beginPath();
    ctx.arc(CX, CY, arenaR, 0, Math.PI * 2);
    ctx.strokeStyle = "rgba(255,90,90," + (0.25 + danger * 0.6).toFixed(2) + ")";
    ctx.lineWidth = 3 + danger * 3;
    ctx.stroke();

    // 玩家
    for (const p of players) {
      if (!p.alive && p.fall > 0.75) continue;
      const k = p.alive ? 1 : Math.max(0, 1 - p.fall / 0.75);
      const r = p.r * k;
      if (r < 1) continue;
      ctx.save();
      ctx.globalAlpha = p.alive ? 1 : k;
      // 影子
      ctx.beginPath();
      ctx.ellipse(p.x + 3, p.y + r * 0.85, r * 0.9, r * 0.35, 0, 0, 7);
      ctx.fillStyle = "rgba(0,0,0,.45)";
      ctx.fill();

      const g = ctx.createRadialGradient(p.x - r * .3, p.y - r * .4, r * .1, p.x, p.y, r);
      g.addColorStop(0, "#ffffff");
      g.addColorStop(.35, p.color);
      g.addColorStop(1, shade(p.color, -0.55));
      ctx.beginPath();
      ctx.arc(p.x, p.y, r, 0, Math.PI * 2);
      ctx.fillStyle = g;
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = "rgba(0,0,0,.35)";
      ctx.stroke();

      // 眼睛
      const ex = Math.cos(p.face) * r * 0.28;
      const ey = Math.sin(p.face) * r * 0.28;
      ctx.fillStyle = "#0a0e13";
      ctx.beginPath(); ctx.arc(p.x + ex - r * .22, p.y + ey - r * .1, r * .12, 0, 7); ctx.fill();
      ctx.beginPath(); ctx.arc(p.x + ex + r * .22, p.y + ey - r * .1, r * .12, 0, 7); ctx.fill();

      // 名字
      ctx.font = "600 " + Math.round(13) + "px ui-monospace,monospace";
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.fillText(p.name, p.x, p.y - r - 9);
      ctx.restore();
    }
    ctx.restore();

    // HUD
    ctx.font = "500 13px ui-monospace,monospace";
    ctx.textAlign = "left";
    ctx.fillStyle = "rgba(255,255,255,.4)";
    ctx.fillText("ROUND " + roundN + "   ·   " + Math.max(0, timeT).toFixed(1) + "s", 26, 34);
    for (let i = 0; i < players.length; i++) {
      const p = players[i];
      ctx.fillStyle = p.alive ? p.color : "rgba(255,255,255,.15)";
      ctx.fillRect(26 + i * 74, 48, 60, 3);
    }

    if (state === "count") {
      ctx.textAlign = "center";
      const n = Math.ceil(countT);
      ctx.fillStyle = "rgba(255,255,255,.9)";
      ctx.font = "700 90px ui-monospace,monospace";
      ctx.fillText(n > 0 ? String(n) : "GO", CX, CY + 30);
    }
    if (state === "over") {
      ctx.fillStyle = "rgba(6,9,13,.72)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      if (winner) {
        ctx.font = "700 52px ui-monospace,monospace";
        ctx.fillStyle = winner.color;
        ctx.fillText(winner.name + " 赢", CX, CY - 10);
      } else {
        ctx.font = "700 52px ui-monospace,monospace";
        ctx.fillStyle = "#e7eef6";
        ctx.fillText("全灭", CX, CY - 10);
      }
      ctx.font = "400 15px ui-monospace,monospace";
      ctx.fillStyle = "rgba(255,255,255,.55)";
      ctx.fillText("按 R 再来一局 · 按 2 / 3 / 4 换人数", CX, CY + 46);
    }
    if (state === "menu") {
      ctx.fillStyle = "rgba(6,9,13,.86)";
      ctx.fillRect(0, 0, W, H);
      ctx.textAlign = "center";
      ctx.fillStyle = "#eaf3fb";
      ctx.font = "700 46px ui-monospace,monospace";
      ctx.fillText("一个键盘四个人", CX, 176);
      ctx.font = "400 14px ui-monospace,monospace";
      ctx.fillStyle = "rgba(255,255,255,.45)";
      ctx.fillText("擂台会一直缩小，最后站在上面的那个赢", CX, 208);

      const n = startCount;
      for (let i = 0; i < 4; i++) {
        const col = KEYSETS[i].color;
        const bx = CX - 330 + i * 168;
        const on = i < n;
        ctx.globalAlpha = on ? 1 : 0.22;
        ctx.fillStyle = "rgba(255,255,255,.03)";
        ctx.fillRect(bx, 268, 150, 128);
        ctx.strokeStyle = col;
        ctx.lineWidth = on ? 2 : 1;
        ctx.strokeRect(bx, 268, 150, 128);
        ctx.fillStyle = col;
        ctx.font = "700 20px ui-monospace,monospace";
        ctx.fillText("P" + (i + 1), bx + 75, 302);
        ctx.font = "400 13px ui-monospace,monospace";
        ctx.fillStyle = "rgba(255,255,255,.72)";
        ctx.fillText(KEYHINT[i], bx + 75, 344);
        ctx.font = "400 11px ui-monospace,monospace";
        ctx.fillStyle = "rgba(255,255,255,.35)";
        ctx.fillText(on ? "参战" : "按 " + (i + 1) + " 加入", bx + 75, 372);
        ctx.globalAlpha = 1;
      }
      ctx.fillStyle = "rgba(255,255,255,.75)";
      ctx.font = "600 16px ui-monospace,monospace";
      ctx.fillText("按 " + n + " 人开局 → 空格 / 回车 开始", CX, 460);
      ctx.font = "400 12px ui-monospace,monospace";
      ctx.fillStyle = "rgba(255,255,255,.3)";
      ctx.fillText("建议用 2 人（WASD vs 方向键）：普通键盘同时按 8 个键会丢键", CX, 492);
    }
  }

  function shade(hex, amt) {
    const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16), b = parseInt(hex.slice(5, 7), 16);
    const f = amt < 0 ? 0 : 255, t = Math.abs(amt);
    return "rgb(" + Math.round(r + (f - r) * t) + "," + Math.round(g + (f - g) * t) + "," + Math.round(b + (f - b) * t) + ")";
  }

  /* ================= 输入 ================= */
  window.addEventListener("keydown", function (e) {
    const k = e.key.toLowerCase();
    keys[k] = true;
    if (k === "r") { reset(Math.max(2, players.length)); }
    if (state === "menu") {
      if (k >= "2" && k <= "4") { startCount = +k; }
      if (k === " " || k === "enter") { e.preventDefault(); reset(startCount); }
    }
    if (["arrowup", "arrowdown", "arrowleft", "arrowright", " "].indexOf(k) >= 0) e.preventDefault();
  });
  window.addEventListener("keyup", function (e) { keys[e.key.toLowerCase()] = false; });
  window.addEventListener("blur", function () { for (const k in keys) keys[k] = false; });

  /* ================= 主循环 ================= */
  let last = 0;
  function frame(t) {
    if (!last) last = t;
    let dt = Math.min(0.05, (t - last) / 1000);
    last = t;
    const guard = 4;
    for (let i = 0; i < guard; i++) step(dt / guard);
    shake *= Math.exp(-6 * dt);
    draw();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
